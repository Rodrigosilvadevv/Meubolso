name: Build and Deploy iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      BUNDLE_ID: com.meubolso.bolso
      TEAM_ID: 882XKXMS4F

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Xcode (mais recente estável)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_PUBLIC_URL: https://meubolso-bhn2.onrender.com
        run: npm run build

      - name: Generate iOS App Icons
        run: |
          if [ -f assets/icon-only.png ]; then
            npx --yes @capacitor/assets generate --ios
          else
            echo "assets/icon-only.png não encontrado: usando o ícone padrão do Capacitor"
          fi

      - name: Capacitor Sync iOS
        run: npx cap sync ios

      - name: Configure iOS Capabilities
        run: |
          cat > ios/App/App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
            <key>com.apple.developer.applesignin</key>
            <array>
              <string>Default</string>
            </array>
          </dict>
          </plist>
          EOF

          PLIST=ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy

          $PB -c "Add :UIBackgroundModes array" "$PLIST" || true
          $PB -c "Add :UIBackgroundModes:0 string remote-notification" "$PLIST" || true
          $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true

          cat "$PLIST"

      - name: Prepare App Store Connect API Key
        env:
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          RAW_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          RAW_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          P8="$RUNNER_TEMP/keys/AuthKey.p8"

          # Aceita o .p8 em texto puro ou em base64
          if printf '%s' "$API_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$API_KEY_P8" > "$P8"
          else
            printf '%s' "$API_KEY_P8" | tr -d '[:space:]' | base64 --decode > "$P8"
          fi
          chmod 600 "$P8"

          # Remove espaços e quebras de linha que tenham vindo nos secrets
          KEY_ID=$(printf %s "$RAW_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf %s "$RAW_ISSUER_ID" | tr -d '[:space:]')
          echo "KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "ISSUER_ID=$ISSUER_ID" >> "$GITHUB_ENV"

          echo "Tamanhos originais: key=${#RAW_KEY_ID} (esperado 10), issuer=${#RAW_ISSUER_ID} (esperado 36)"
          echo "p8 com BEGIN PRIVATE KEY: $(grep -c 'BEGIN PRIVATE KEY' "$P8") (esperado 1)"

          # Diagnóstico: mostra Key ID e Issuer ID espaçados (o GitHub não mascara assim)
          # e a impressão digital da chave PÚBLICA do .p8 (não revela a chave privada)
          echo "Key ID no secret:    $(printf %s "$KEY_ID" | sed 's/./& /g')"
          echo "Issuer ID no secret: $(printf %s "$ISSUER_ID" | sed 's/./& /g')"
          echo "Impressão digital do .p8: $(openssl pkey -in "$P8" -pubout | openssl dgst -sha256)"

          # Testa as credenciais direto na API da Apple antes de compilar
          export KEY_ID ISSUER_ID
          python3 -m venv /tmp/v
          /tmp/v/bin/pip -q install pyjwt cryptography
          TOKEN=$(/tmp/v/bin/python - <<'PY'
          import jwt, time, os
          k = open(os.environ["RUNNER_TEMP"] + "/keys/AuthKey.p8").read()
          now = int(time.time())
          print(jwt.encode(
              {"iss": os.environ["ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
              k, algorithm="ES256", headers={"kid": os.environ["KEY_ID"]}))
          PY
          )
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://api.appstoreconnect.apple.com/v1/apps?limit=1")
          echo "API da Apple respondeu HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Credenciais da Apple inválidas (HTTP $CODE). Confira Key ID, Issuer ID e o .p8 da mesma chave."
            exit 1
          fi

      - name: Archive (assinatura automática pela API da Apple)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_ENTITLEMENTS=App/App.entitlements \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Export and Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>upload</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Cleanup API Key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"