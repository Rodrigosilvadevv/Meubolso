name: Build and Deploy iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      BUNDLE_ID: com.meubolso.bolso
      TEAM_ID: 882XKXMS4F

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Xcode (mais recente estável)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        env:
          RAW_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          RAW_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          RAW_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          RAW_RC_IOS_KEY: ${{ secrets.VITE_RC_IOS_KEY }}
          VITE_PUBLIC_URL: https://meubolso-bhn2.onrender.com
        run: |
          clean() { printf '%s' "$1" | awk 'NF{print $1; exit}' | sed -E 's/^[A-Za-z_]+=//'; }
          export VITE_SUPABASE_URL="$(clean "$RAW_SUPABASE_URL")"
          export VITE_SUPABASE_ANON_KEY="$(clean "$RAW_SUPABASE_ANON_KEY")"
          export VITE_VAPID_PUBLIC_KEY="$(clean "$RAW_VAPID_PUBLIC_KEY")"
          export VITE_RC_IOS_KEY="$(clean "$RAW_RC_IOS_KEY")"
          npm run build

      - name: Generate iOS App Icons
        run: |
          if [ -f assets/icon-only.png ]; then
            npx --yes @capacitor/assets generate --ios
          else
            echo "assets/icon-only.png não encontrado: usando o ícone padrão do Capacitor"
          fi

      - name: Capacitor Sync iOS
        run: npx cap sync ios

      - name: Configure iOS Capabilities and Version 1.0.3
        run: |
          cat > ios/App/App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
            <key>com.apple.developer.applesignin</key>
            <array>
              <string>Default</string>
            </array>
          </dict>
          </plist>
          EOF

          PLIST=ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy

          $PB -c "Add :UIBackgroundModes array" "$PLIST" || true
          $PB -c "Add :UIBackgroundModes:0 string remote-notification" "$PLIST" || true
          $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true

          # Força a versão pública para 1.0.3 e o build number dinâmico por tentativa
          $PB -c "Set :CFBundleShortVersionString 1.0.3" "$PLIST" || $PB -c "Add :CFBundleShortVersionString string 1.0.3" "$PLIST"
          $PB -c "Set :CFBundleVersion ${{ github.run_number }}.${{ github.run_attempt }}" "$PLIST" || true

          cat "$PLIST"

      - name: Push iOS - AppDelegate (repassa o token da Apple ao Capacitor)
        run: |
          python3 - <<'PY'
          import pathlib, sys

          p = pathlib.Path('ios/App/App/AppDelegate.swift')
          src = p.read_text()

          if 'capacitorDidRegisterForRemoteNotifications' not in src:
              methods = '''
              // Repassa o token de push da Apple para o plugin do Capacitor
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          '''
              last = src.rstrip().rfind('}')   # chave que fecha a classe AppDelegate
              p.write_text(src[:last].rstrip() + '\n' + methods + '}\n')

          if 'capacitorDidRegisterForRemoteNotifications' not in p.read_text():
              sys.exit('ERRO: não consegui adicionar os métodos de push no AppDelegate.swift')
          print('AppDelegate pronto para push')
          PY

          echo "---- fim do AppDelegate.swift ----"
          tail -15 ios/App/App/AppDelegate.swift

      - name: Prepare App Store Connect API Key
        env:
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          RAW_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          RAW_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          P8="$RUNNER_TEMP/keys/AuthKey.p8"

          if printf '%s' "$API_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$API_KEY_P8" > "$P8"
          else
            printf '%s' "$API_KEY_P8" | tr -d '[:space:]' | base64 --decode > "$P8"
          fi
          chmod 600 "$P8"

          KEY_ID=$(printf %s "$RAW_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf %s "$RAW_ISSUER_ID" | tr -d '[:space:]')
          echo "KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "ISSUER_ID=$ISSUER_ID" >> "$GITHUB_ENV"

      - name: Limpar certificados antigos e revogar/recriar assinatura a cada build
        env:
          KEY_ID: ${{ env.KEY_ID }}
          ISSUER_ID: ${{ env.ISSUER_ID }}
        run: |
          # Limpa o keychain local para garantir que um novo certificado seja solicitado e gerado do zero a cada execução
          security default-keychain -s login.keychain || true
          security delete-keychain ios_build.keychain || true
          security create-keychain -p "" ios_build.keychain
          security default-keychain -s ios_build.keychain
          security unlock-keychain -p "" ios_build.keychain
          security set-keychain-settings -t 3600 -l ios_build.keychain

          # Remove perfis de provisionamento locais antigos do runner
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*

      - name: Archive (assinatura automática pela API da Apple)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_ENTITLEMENTS=App/App.entitlements \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}.${{ github.run_attempt }}" \
            archive

      - name: Verificar push no app compilado (só avisa, não bloqueia o envio)
        run: |
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          codesign -d --entitlements :- "$APP" 2>/dev/null | tee "$RUNNER_TEMP/entitlements.txt" || true
          if grep -q 'aps-environment' "$RUNNER_TEMP/entitlements.txt"; then
            echo "OK: o app compilado tem a capability de push"
          else
            echo "::warning::O app compilado está SEM aps-environment (push não vai funcionar)"
          fi

      - name: Export and Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>upload</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Cleanup API Key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"